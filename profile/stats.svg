<svg width="495" height="195" viewBox="0 0 495 195"
     fill="none"
     xmlns="http://www.w3.org/2000/svg">

  <rect
    x="0.5"
    y="0.5"
    width="494"
    height="194"
    rx="8"
    fill="#0D1117"
    stroke="#30363D"
  />

  <style>
    .title {
      fill: #FF4D8D;
      font: 600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    }

