name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create profile folder
        run: mkdir -p profile

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=tutybas&show_icons=true&locale=pt-br&bg_color=0D1117&title_color=FF4D8D&text_color=FFFFFF&icon_color=FF4D8D&border_color=30363D&border_radius=8
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Most Used Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=tutybas&layout=compact&langs_count=8&locale=pt-br&bg_color=0D1117&title_color=FF4D8D&text_color=FFFFFF&border_color=30363D&border_radius=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
